name: WoW Forever AH Collector

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: wow-forever-ah-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect market snapshot
        env:
          DATA_SOURCE: blizzard
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          BNET_REGION: eu
          BNET_RULESET_ID: 1
          BNET_HOUSE_ID: ${{ secrets.BNET_HOUSE_ID }}
          MARKET_DATABASE_URL: ${{ secrets.MARKET_DATABASE_URL }}
        run: python collect_once.py